<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Student Details</h2>

    <table>
        <tr>
            <th>Serial No.</th>
            <th>Roll No.</th>
            <th>Mobile No.</th>
        </tr>
        <tr>
            <td>1</td>
            <td>101</td>
            <td>9876543210</td>
        </tr>
        <tr>
            <td>2</td>
            <td>102</td>
            <td>9123456780</td>
        </tr>
        <tr>
            <td>3</td>
            <td>103</td>
            <td>9988776655</td>
        </tr>
    </table>

</body>
</html>
