<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Web Page Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #content {
            font-size: 22px;
            margin: 20px;
            color: blue;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Dynamic Web Page</h1>

    <div id="content">
        Click the button to change this text.
    </div>

    <button onclick="changeContent()">Click Me</button>

    <script>
        function changeContent() {
            document.getElementById("content").innerHTML =
                "🎉 The content has been updated using JavaScript and DOM!";
        }
    </script>

</body>
</html>
