<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Web Page using AJAX</title>
    <style>
        body{
            font-family: Arial;
            text-align:center;
            margin-top:50px;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            color:green;
        }

        button{
            padding:10px 20px;
            font-size:16px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h2>AJAX Dynamic Content Example</h2>

<button onclick="loadData()">Load Content</button>

<div id="result">Click the button to load content.</div>

<script>

function loadData() {

    var xhr = new XMLHttpRequest();

    xhr.open("GET", "data.txt", true);

    xhr.onreadystatechange = function() {
        if(xhr.readyState == 4 && xhr.status == 200){
            document.getElementById("result").innerHTML = xhr.responseText;
        }
    };

    xhr.send();
}

</script>

</body>
</html>
